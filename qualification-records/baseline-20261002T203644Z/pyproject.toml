[project]
name = "llm-inference-service"
version = "0.1.0"
description = "Provider-agnostic, production-oriented service boundary for large language model inference."
readme = "README.md"
authors = [
    { name = "Michael Mensah Ofeor" }
]
requires-python = ">=3.12.3,<3.13"
dependencies = []

[project.optional-dependencies]
vllm = [
    "vllm==0.30.0",
    "transformers==5.17.0",
    "torch==2.13.0+cu132",
    "torchvision==0.28.0+cu132",
    "torchaudio==2.11.0+cpu",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"
